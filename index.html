<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171326">
  <title>Admins of Royalty Trilogy — Movie Soundtrack</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #171326;
      --gold: #e8c878;
      --cream: #fff8e8;
      --muted: #c9c1d4;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--cream);
      font-family: Georgia, "Times New Roman", serif;
      text-align: center;
      background:
        radial-gradient(ellipse at top, rgba(116, 83, 143, .34), transparent 55%),
        linear-gradient(145deg, #171326, #29203a 55%, #171326);
    }
    main {
      width: min(100%, 720px);
      padding: clamp(28px, 7vw, 64px) clamp(20px, 6vw, 56px);
      border: 1px solid rgba(232, 200, 120, .55);
      border-radius: 22px;
      background: rgba(15, 12, 25, .62);
      box-shadow: 0 24px 80px rgba(0, 0, 0, .4);
    }
    .crown { color: var(--gold); font-size: 2.5rem; line-height: 1; }
    .eyebrow {
      margin: 20px 0 10px;
      color: var(--gold);
      font: 700 .78rem/1.4 Arial, sans-serif;
      letter-spacing: .22em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(2.4rem, 8vw, 4.6rem);
      line-height: 1.02;
      font-weight: 700;
      text-wrap: balance;
    }
    h1 span { display: block; color: var(--gold); }
    .subtitle {
      margin: 22px auto 30px;
      max-width: 510px;
      color: var(--muted);
      font: 1.05rem/1.7 Arial, sans-serif;
    }
    .listen {
      display: inline-block;
      margin-bottom: 14px;
      color: #171326;
      background: var(--gold);
      border: 0;
      border-radius: 999px;
      padding: 13px 25px;
      font: 700 1rem Arial, sans-serif;
      cursor: pointer;
      transition: transform .15s ease, background .15s ease;
    }
    .listen:hover { transform: translateY(-2px); background: #f2d995; }
    audio { display: block; width: min(100%, 420px); margin: 12px auto 0; }
    .hint { margin: 18px 0 0; color: #aaa1b8; font: .82rem/1.5 Arial, sans-serif; }
    footer {
      margin-top: 34px;
      color: #a79db4;
      font: .72rem Arial, sans-serif;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main>
    <div class="crown" aria-hidden="true">♛</div>
    <p class="eyebrow">The Complete Movie Trilogy</p>
    <h1>Admins of <span>Royalty</span></h1>
    <p class="subtitle">
      The drama. The laughs. The legend.<br>
      Relive the trilogy with the <strong>Admins of Royalty Movie Soundtrack</strong>.
      Press play and let the royal soundtrack begin.
    </p>

    <button class="listen" id="listenButton" type="button">▶ Click to Hear the Soundtrack</button>
    <audio id="soundtrack" controls preload="none">
      <source src="AdminsOfRoyalty.mp3" type="audio/mpeg">
      Your browser does not support audio playback.
    </audio>
    <p class="hint">Turn up the volume and enjoy your royal listening experience.</p>
    <footer>Long live the royalty</footer>
  </main>

  <script>
    const player = document.getElementById('soundtrack');
    const button = document.getElementById('listenButton');
    button.addEventListener('click', async () => {
      try {
        await player.play();
        button.textContent = '♫ Now Playing';
      } catch (error) {
        player.focus();
      }
    });
    player.addEventListener('ended', () => {
      button.textContent = '▶ Play the Soundtrack Again';
    });
    player.addEventListener('pause', () => {
      if (player.currentTime > 0 && !player.ended) {
        button.textContent = '▶ Resume the Soundtrack';
      }
    });
  </script>
</body>
</html>
